name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/f45-booth.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: f45-booth-apk
          path: out/f45-booth.apk

      # main 브랜치면 고정 주소로도 올림:
      # https://github.com/f45seongsu/booth/releases/download/android-latest/f45-booth.apk
      - name: Publish to release (android-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: F45 Booth Android (latest)
          body: |
            포토부스 안드로이드 앱 최신 빌드 (run ${{ github.run_number }}, ${{ github.sha }})
            태블릿 크롬에서 f45-booth.apk 를 받아 설치하세요.
          files: out/f45-booth.apk
          make_latest: true
